[alembic]
script_location = alembic
# `alembic upgrade head` is run from apps/api, where `app` is the package to import.
prepend_sys_path = .
# sqlalchemy.url is absent on purpose: env.py takes it from DATABASE_URL through app.services
# .persistence, so a database URL is spelled in exactly one place and cannot drift from what the
# app connects with. Note DATABASE_URL must be EXPORTED -- Settings(env_file=".env") is CWD-relative
# and is not walked upward, so the repo-root .env is not seen from here.
