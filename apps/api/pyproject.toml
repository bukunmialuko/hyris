[project]
name = "hyris-api"
version = "0.2.0"
description = "Hyris backend — agentic quiz generation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.50",
    "trafilatura>=1.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local `alembic/` migrations directory makes ruff read the alembic PACKAGE as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Star-imports and unused fixtures are idiomatic in tests.
"tests/*" = ["F403", "F405"]
# Alembic generates revisions from its own template: unsorted imports, typing.Union,
# trailing whitespace after "Revises:". Not worth hand-editing every migration.
"alembic/versions/*" = ["E501", "I001", "W291", "UP035", "UP007"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
