services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hyris
      POSTGRES_PASSWORD: hyris
      POSTGRES_DB: hyris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyris"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hyris:hyris@db:5432/hyris
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
